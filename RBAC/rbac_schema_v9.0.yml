  tenant:
    - "tenant:read"
    - "tenant:update"
    - "tenant:manage:modules"
    - "tenant:manage:features"

  # ===== ACCESSCONTROL DOMAIN =====
  accesscontrol:
    - "accesscontrol:read"
    - "accesscontrol:update:tenant_roles"
    - "accesscontrol:manage:service_accounts"

  # ===== IDENTITY DOMAIN =====
  identity:
    - "identity:invite:user"
    - "identity:read:tenant_users"
    - "identity:update:tenant_users"

  # ===== MEMBERSHIP DOMAIN =====
  membership:
    - "membership:manage:roles"
    - "membership:read:tenant_members"
    - "membership:update:tenant_members"

  # ===== ESTIMATE DOMAIN =====
  estimate:
    # Basic CRUD
    - "estimate:create"
    - "estimate:list"
    - "estimate:list:own"
    - "estimate:read"
    - "estimate:read:own"
    - "estimate:update"
    - "estimate:update:own"
    - "estimate:delete"
    - "estimate:delete:own" # CRITICAL - Not granted to PM by default

    # Workflow actions
    - "estimate:send"
    - "estimate:send:own"
    - "estimate:approve" # CRITICAL - Not granted to PM by default

    # Financial visibility
    - "estimate:read:profit" # CRITICAL - Not granted to PM by default

  # ===== INVOICE DOMAIN =====
  invoice:
    # Basic CRUD
    - "invoice:create"
    - "invoice:list"
    - "invoice:list:own"
    - "invoice:read"
    - "invoice:read:own"
    - "invoice:update"
    - "invoice:update:own"
    - "invoice:delete"
    - "invoice:delete:own" # CRITICAL - Not granted to PM by default

    # Workflow actions
    - "invoice:send"
    - "invoice:send:own"
    - "invoice:approve" # CRITICAL - Not granted to PM by default
    - "invoice:writeoff"

    # Financial visibility
    - "invoice:read:profit" # CRITICAL - Not granted to PM by default

  # ===== PROJECT DOMAIN =====
  project:
    # Basic CRUD
    - "project:create"
    - "project:create:own"
    - "project:list"
    - "project:list:own"
    - "project:list:assigned"
    - "project:list:delivery_assigned"
    - "project:read"
    - "project:read:own"
    - "project:read:assigned"
    - "project:read:delivery_info"
    - "project:update"
    - "project:update:own"
    - "project:delete"

    # Assignment actions
    - "project:assign:pm"
    - "project:assign:worker"
    - "project:assign:driver"
    - "project:assign:task"

    # Visibility
    - "project:read:team"
    - "project:read:schedule"
    - "project:read:financial" # CRITICAL - Not granted to PM by default

  # ===== TASK DOMAIN =====
  task:
    # Basic CRUD
    - "task:create"
    - "task:create:project"
    - "task:list"
    - "task:list:project"
    - "task:list:assigned"
    - "task:list:delivery"
    - "task:read"
    - "task:read:project"
    - "task:read:assigned"
    - "task:read:delivery"
    - "task:update"
    - "task:update:project"
    - "task:update:own"
    - "task:update:delivery"
    - "task:delete"

    # Assignment
    - "task:assign:worker"
    - "task:assign:driver"

  # ===== EXPENSES DOMAIN =====
  expenses:
    # Basic CRUD
    - "expenses:create"
    - "expenses:create:own"
    - "expenses:create:delivery"
    - "expenses:list"
    - "expenses:list:own"
    - "expenses:list:project"
    - "expenses:read"
    - "expenses:read:own"
    - "expenses:read:project"
    - "expenses:update"
    - "expenses:delete"

    # Workflow
    - "expenses:approve"

  # ===== INVENTORY DOMAIN =====
  inventory:
    # Basic CRUD
    - "inventory:create:item"
