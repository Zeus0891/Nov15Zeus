# 🏛️ RBAC Schema v9.0 - Phase 1 Internal Roles
# BeeSmart Pro ERP - Aligned with rbac_permissions_v3.md
#
# SOURCE OF TRUTH: rbac_permissions_v3.md
#
# PHASE 1 SCOPE:
# ✅ 5 internal member roles only
# ✅ Multi-tenant isolation via RLS
# ✅ Minimal, explicit roles and permissions
# ✅ Static RBAC + runtime TenantSettings toggles
# ✅ Permission naming: domain:action:subaction
# ✅ Production-ready, no wildcards

# ============================================================================
# RBAC METADATA & VERSIONING
# ============================================================================
rbac_version: "9.0"
generated_date: "2025-11-18T18:00:00Z"
compatibility: "BeeSmart Pro ERP - Phase 1"
phase: "PHASE_1_INTERNAL_MEMBERS"
source_document: "rbac_permissions_v3.md"
conventions_aligned: true
description: "Phase 1 RBAC schema with 5 internal member roles and explicit permission catalog"

# ============================================================================
# SECURITY CONTEXT - Phase 1
# ============================================================================
security_configuration:
  # Role hierarchy (0 = highest authority)
  role_hierarchy_convention: "0_is_highest"
  hierarchy_range: "0-10"
  phase_1_roles: 5

  # Permission strategy
  permission_strategy: "explicit_minimal_catalog"
  naming_convention: "domain:action:subaction"

  # Three-layer security architecture
  security_layers:
    - "RBAC (static role permissions)"
    - "TenantSettings (runtime toggles for Phase 1)"
    - "RLS (row-level PostgreSQL isolation via withRLS wrapper)"

  # Phase 1 design principles
  design_principles:
    - "Multi-tenant isolation first (RLS enforced)"
    - "Minimal, explicit roles (5 internal only)"
    - "Consistent permission naming (domain:action:subaction)"
    - "Static RBAC + runtime TenantSettings toggles"
    - "Future-ready for AccessPolicy engine (Phase 2+)"

  # Compliance requirements
  compliance_standards:
    - "SOC2_TYPE_II"
    - "GDPR_COMPLIANT"
    - "MULTI_TENANT_ISOLATED"
    - "CONSTRUCTION_ERP"

# ============================================================================
# DOMAINS - Aligned with ERP Modules (Phase 1)
# ============================================================================
domains:
  - key: "tenant"
    description: "Tenant configuration and management"
    module: "tenant.prisma"

  - key: "accesscontrol"
    description: "Role and permission management"
    module: "accesscontrol.prisma"

  - key: "identity"
    description: "User and actor identity management"
    module: "identity.prisma"

  - key: "membership"
    description: "Member management and roles"
    module: "membership.prisma"

  - key: "estimate"
    description: "Estimate and proposal management"
    module: "estimate.prisma"

  - key: "invoice"
    description: "Invoice and billing management"
    module: "invoice.prisma"

  - key: "project"
    description: "Project management and execution"
    module: "projectsCore.prisma"

  - key: "task"
    description: "Task management and assignment"
    module: "tasks.prisma"

  - key: "expenses"
    description: "Expense tracking and reimbursement"
    module: "expensecore.prisma, expenses.prisma"

  - key: "inventory"
    description: "Materials and stock management"
    module: "inventoryCore.prisma, inventoryTransactions.prisma, inventoryControl.prisma"

  - key: "scheduling"
    description: "Time and resource scheduling"
    module: "schedulingCore.prisma, scheduling.prisma"

  - key: "time"
    description: "Time tracking and attendance"
    module: "timeattendance.prisma"

  - key: "payroll"
    description: "Payroll processing and management"
    module: "payroll.prisma"

  - key: "crm"
    description: "Customer relationship management"
    module: "crmcore.prisma, crmcommunication.prisma, crmrelationships.prisma"

  - key: "documents"
    description: "Document and file management"
    module: "documentscore.prisma, documentsai.prisma"

  - key: "changeorder"
    description: "Change order management"
    module: "changeorder.prisma"

  - key: "ai"
    description: "AI and automation features"
    module: "aicore.prisma, aiinsights.prisma, aidocument.prisma"

  - key: "analytics"
    description: "Analytics and reporting"
    module: "analytics.prisma"

# ============================================================================
# ACTIONS - Standardized Vocabulary
# ============================================================================
actions:
  # Core CRUD operations
  - "create"
  - "read"
  - "list"
  - "update"
  - "delete"

  # Business workflow actions
  - "approve"
  - "send"
  - "assign"
  - "manage"
  - "invite"

  # Specialized actions
  - "run"
  - "correct"
  - "adjust"
  - "investigate"
  - "writeoff"
  - "upload"
  - "comment"
  - "ask"
  - "assist"
  - "generate"

# ============================================================================
# SUBACTIONS - Granular Control
# ============================================================================
subactions:
  # Ownership and scope
  - "own"
  - "assigned"
  - "project"
  - "delivery"
  - "delivery_assigned"
  - "delivery_info"
  - "delivery_items"
  - "tenant"
  - "tenant_users"
  - "tenant_members"
  - "tenant_roles"
  - "tenant_kpis"

  # Status and operations
  - "status"
  - "own_entry"
  - "modules"
  - "features"
  - "roles"
  - "service_accounts"

  # Team and people
  - "pm"
  - "worker"
  - "driver"
  - "team"
  - "schedule"

  # Financial and data
  - "financial"
  - "profit"
  - "quantity"
  - "item"
  - "loss"

  # Reports and AI
  - "project_report"
  - "financial_report"
  - "demo_report"
  - "task"
  - "delivery"

# ============================================================================
# PHASE 1 ROLES - 5 Internal Member Roles
# ============================================================================
roles:
  # ======= ADMIN - Tenant Owner (Hierarchy 0) =======
  - code: "ADMIN"
    hierarchy: 0
    display_name: "Administrator"
    description: "Tenant owner with full control of business data and tenant configuration within their tenant"
    role_type: "INTERNAL"
    business_context:
      typical_users: ["Company Owners", "Tenant Creators"]
      access_scope: "All tenant business data and configuration"
      use_cases:
        - "Tenant configuration and module management"
        - "User and member management"
        - "Full CRUD on all business entities"
        - "Financial oversight and approvals"
    exclusions:
      - "No platform-wide or system-level powers"
      - "No cross-tenant access (RLS enforced)"
      - "No infrastructure management"

  # ======= PROJECT_MANAGER - Scoped Operational Manager (Hierarchy 2) =======
  - code: "PROJECT_MANAGER"
    hierarchy: 2
    display_name: "Project Manager"
    description: "Scoped manager responsible for own/assigned projects, estimates, invoices, and teams"
    role_type: "INTERNAL"
    business_context:
      typical_users: ["Project Managers", "Construction Managers"]
      access_scope: "Own/assigned projects, estimates, invoices, tasks"
      use_cases:
        - "Manage assigned projects and teams"
        - "Create and send estimates/invoices (own scope)"
        - "Assign workers and drivers to tasks"
        - "View project schedules and team info"
      critical_permissions_note: "Approval and financial permissions NOT granted by default - controlled via TenantSettings"
      exclusions:
        - "No tenant configuration access"
        - "No user/identity management"
        - "No CRM ownership"
        - "No inventory adjustments"
        - "No tenant-level time/payroll access"

  # ======= WORKER - Field/Office Execution Role (Hierarchy 8) =======
  - code: "WORKER"
    hierarchy: 8
    display_name: "Field Worker"
    description: "Field or office execution role working on assigned projects and tasks"
    role_type: "INTERNAL"
    business_context:
      typical_users: ["Field Workers", "Technicians", "Office Staff"]
      access_scope: "Assigned projects, tasks, own records"
      use_cases:
        - "Execute assigned tasks"
        - "Track own time and expenses"
        - "Update task status"
        - "Upload documents to assigned work"
      exclusions:
        - "No estimate or invoice access"
        - "No CRM access"
        - "No project creation or assignment"
        - "No inventory adjustments"
        - "No approvals"

  # ======= DRIVER - Delivery/Logistics Role (Hierarchy 9) =======
  - code: "DRIVER"
    hierarchy: 9
    display_name: "Driver"
    description: "Delivery and logistics role with minimal access to delivery-related information"
    role_type: "INTERNAL"
    business_context:
      typical_users: ["Drivers", "Delivery Personnel", "Logistics Staff"]
      access_scope: "Delivery tasks, delivery info, own records"
      use_cases:
        - "View delivery assignments"
        - "Access job site addresses and delivery windows"
        - "Update delivery task status"
        - "Log delivery-related expenses"
      exclusions:
        - "No full project access beyond delivery info"
        - "No estimate or invoice access"
        - "No inventory adjustments"
        - "No approvals"

  # ======= VIEWER - Sandbox-Only Read-Only Role (Hierarchy 10) =======
  - code: "VIEWER"
    hierarchy: 10
    display_name: "Viewer"
    description: "Read-only role for demos and learning in sandbox tenants only"
    role_type: "INTERNAL"
    business_context:
      typical_users: ["Demo Users", "Training Accounts", "Sandbox Testers"]
      access_scope: "Read-only access to sandbox tenant data"
      use_cases:
        - "Demo and training purposes"
        - "Learning platform features"
        - "Sandbox exploration"
      enforcement_note: "Sandbox-only enforcement via RLS and Tenant.isSandbox flag"
      exclusions:
        - "No write operations (no create/update/delete/approve)"
        - "No access to production tenants (Tenant.isSandbox = false)"
        - "No tenant configuration"
        - "No real billing or integrations"

# ============================================================================
# COMPLETE PERMISSION CATALOG - Phase 1
# ============================================================================
# All permissions that exist in the system
# Organized by domain for clarity
# ============================================================================

permission_catalog:
