  # ===== DOCUMENTS DOMAIN =====
  documents:
    # Basic CRUD
    - "documents:create"
    - "documents:list"
    - "documents:list:project"
    - "documents:list:assigned"
    - "documents:read"
    - "documents:read:project"
    - "documents:read:assigned"
    - "documents:read:delivery"
    - "documents:update"
    - "documents:delete"

