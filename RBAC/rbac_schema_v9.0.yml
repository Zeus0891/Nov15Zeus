      - permission: "changeorder:approve"
        gated_by: "TenantSettings.pmCanApproveChangeOrders"

    deletes:
      - permission: "estimate:delete:own"
        gated_by: "TenantSettings.pmCanDeleteOwnEstimates"

      - permission: "invoice:delete:own"
        gated_by: "TenantSettings.pmCanDeleteOwnInvoices"

      - permission: "changeorder:delete:own"
