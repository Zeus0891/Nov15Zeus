# USAGE NOTES
# ============================================================================
usage_notes:
  rbac_check: "requirePermission(ctx, 'domain:action:subaction')"
  rls_wrapper: "await withRLS(ctx, async (db) => { ... })"
  tenant_settings_check: |
    // Example: PM approval check
    requirePermission(ctx, 'estimate:approve'); // RBAC check
    const settings = await getTenantSettings(ctx.tenantId);
    if (!settings.pmCanApproveEstimates) {
      throw new ForbiddenError('PM approval not enabled for this tenant');
    }

  actor_attribution: |
    // Every entity tracks who created/modified it
    createdByActorId: ctx.actorId
    updatedByActorId: ctx.actorId

  audit_trail: |
    // Complete 1:1:1 traceability
    Actor → Member → Role → Permission → Action → Entity
