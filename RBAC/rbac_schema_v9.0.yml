# ============================================================================
# ROLE GRANTS - Baseline Permissions Granted to Each Role
# ============================================================================
# CRITICAL PERMISSIONS for PROJECT_MANAGER are cataloged above but NOT granted here
# They are controlled via TenantSettings in Phase 1
# ============================================================================

role_grants:
  # ======= ADMIN - Full Tenant Control =======
  ADMIN:
    note: "Tenant owner with full business data and configuration access"
    permissions:
      # Tenant Management
      - "tenant:read"
      - "tenant:update"
      - "tenant:manage:modules"
      - "tenant:manage:features"

      # Identity & Membership
      - "identity:invite:user"
      - "identity:read:tenant_users"
      - "identity:update:tenant_users"
      - "membership:manage:roles"
      - "membership:read:tenant_members"
      - "membership:update:tenant_members"

      # AccessControl
      - "accesscontrol:read"
      - "accesscontrol:update:tenant_roles"
      - "accesscontrol:manage:service_accounts"

      # Estimates (full access)
      - "estimate:create"
      - "estimate:list"
      - "estimate:read"
      - "estimate:update"
      - "estimate:delete"
      - "estimate:send"
      - "estimate:approve"

      # Invoices (full access)
      - "invoice:create"
      - "invoice:list"
      - "invoice:read"
      - "invoice:update"
      - "invoice:delete"
      - "invoice:send"
      - "invoice:approve"
      - "invoice:writeoff"

      # Projects (full access)
      - "project:create"
      - "project:list"
      - "project:read"
      - "project:update"
      - "project:delete"
      - "project:assign:pm"
      - "project:assign:worker"
      - "project:assign:driver"
      - "project:read:financial"

      # Tasks (full access)
      - "task:create"
      - "task:list"
      - "task:read"
      - "task:update"
      - "task:delete"
      - "task:assign:worker"
      - "task:assign:driver"

      # Expenses (full access)
      - "expenses:create"
      - "expenses:list"
      - "expenses:read"
      - "expenses:update"
      - "expenses:delete"
      - "expenses:approve"

      # Inventory (full access)
      - "inventory:create:item"
      - "inventory:list"
      - "inventory:read"
      - "inventory:update:item"
      - "inventory:adjust:quantity"
      - "inventory:investigate:loss"

      # Scheduling & Time
      - "scheduling:create"
      - "scheduling:read"
      - "scheduling:update"
      - "time:read:tenant"
      - "time:correct:tenant"

      # Payroll
      - "payroll:read:tenant"
      - "payroll:run"
      - "payroll:update"

      # CRM (full access)
      - "crm:create"
      - "crm:list"
      - "crm:read"
      - "crm:update"
      - "crm:delete"

      # Documents (full access)
      - "documents:create"
      - "documents:list"
      - "documents:read"
      - "documents:update"
      - "documents:delete"

      # AI & Analytics
      - "ai:ask"
      - "ai:assist:tenant"
      - "ai:generate:project_report"
      - "ai:generate:financial_report"
      - "analytics:read:tenant_kpis"

  # ======= PROJECT_MANAGER - Scoped Manager (BASELINE ONLY) =======
  PROJECT_MANAGER:
    note: "Baseline permissions for PM - Critical permissions (approve, delete, financial) NOT granted by default"
    critical_permissions_gated_by: "TenantSettings flags (pmCanApproveEstimates, pmCanSeeProjectFinancials, etc.)"
    permissions:
      # Estimates (own scope only, NO approve/delete)
      - "estimate:create"
      - "estimate:list:own"
      - "estimate:read:own"
      - "estimate:update:own"
      - "estimate:send:own"

      # Invoices (own scope only, NO approve/delete)
      - "invoice:create"
      - "invoice:list:own"
      - "invoice:read:own"
      - "invoice:update:own"
      - "invoice:send:own"

      # Projects (own scope, NO financial, NO delete)
      - "project:create:own"
      - "project:list:own"
      - "project:read:own"
      - "project:update:own"
      - "project:assign:worker"
      - "project:assign:driver"
      - "project:assign:task"
      - "project:read:team"
      - "project:read:schedule"

      # Tasks (project scope)
      - "task:create:project"
      - "task:list:project"
      - "task:read:project"
      - "task:update:project"
      - "task:assign:worker"
      - "task:assign:driver"

      # Expenses (project scope, summary only)
      - "expenses:list:project"
      - "expenses:read:project"

      # Personal records
      - "time:create:own_entry"
      - "time:read:own"
      - "payroll:read:own"
      - "scheduling:read:own"

      # Documents (project scope)
      - "documents:list:project"
      - "documents:read:project"
      - "documents:upload:project"
      - "documents:comment:project"

      # AI (project scope)
      - "ai:ask"
      - "ai:assist:project"
      - "ai:generate:project_report"

  # ======= WORKER - Field/Office Execution =======
  WORKER:
    note: "Field or office worker with access to assigned work and own records only"
    permissions:
      # Projects (assigned only)
      - "project:list:assigned"
      - "project:read:assigned"

      # Tasks (assigned only)
      # Task execution
      - "task:list:assigned"
      - "task:read:assigned"
      - "task:update:own"

      # Expenses (own only)
      - "expenses:create:own"
      - "expenses:list:own"
      - "expenses:read:own"

      # Time & Scheduling (own only)
      - "time:create:own_entry"
      - "time:read:own"
      - "scheduling:read:own"

      # Documents (assigned only)
      - "documents:list:assigned"
      - "documents:read:assigned"
      - "documents:upload:assigned"

      # AI (task assistance)
      - "ai:ask"
      - "ai:assist:task"

  # ======= DRIVER - Delivery/Logistics =======
  DRIVER:
    note: "Delivery role with minimal access to delivery-related info only"
    permissions:
      # Projects (delivery info only)
      - "project:list:delivery_assigned"
      - "project:read:delivery_info"

      # Tasks (delivery only)
      # Delivery tasks
      - "task:list:delivery"
      - "task:read:delivery"
      - "task:update:delivery"

      # Inventory (delivery items only)
      - "inventory:read:delivery_items"

      # Expenses (delivery only)
      - "expenses:create:delivery"
      - "expenses:list:own"
      - "expenses:read:own"

      # Time & Scheduling (own only)
      - "time:create:own_entry"
      - "time:read:own"
      - "scheduling:read:own"

      # Documents (delivery only)
      - "documents:upload:delivery"
      - "documents:read:delivery"

      # AI (delivery assistance)
      - "ai:ask"
      - "ai:assist:delivery"

  # ======= VIEWER - Sandbox Read-Only =======
  VIEWER:
    note: "Read-only role for sandbox tenants only (Tenant.isSandbox = true)"
    enforcement: "RLS enforces sandbox-only access"
    permissions:
      # Core business data (read-only)
      - "estimate:read"
      - "estimate:list"
      - "invoice:read"
      - "invoice:list"
      - "project:read"
      - "project:list"
      - "crm:read"
      - "crm:list"
      - "inventory:read"
      - "inventory:list"
      - "expenses:read"
      - "expenses:list"

      # Time/Scheduling/Payroll (demo context)
      - "scheduling:read"
      - "time:read"
      - "payroll:read"

      # Documents (read-only)
      - "documents:read"
      - "documents:list"

      # AI (demo reports)
      - "ai:ask"
      - "ai:generate:demo_report"

# ============================================================================
# CRITICAL PERMISSIONS - Cataloged but NOT Granted by Default to PM
# ============================================================================
# These permissions exist in the catalog but are NOT granted to PROJECT_MANAGER
# by default. They are controlled via TenantSettings flags in Phase 1.
#
# In future phases, these will be enforced by AccessPolicy engine.
# ============================================================================

critical_permissions:
  PROJECT_MANAGER_ELEVATED:
    note: "Permissions that require TenantSettings flags to enable for PM"
    gating_mechanism: "Application services check RBAC + TenantSettings"

    approvals:
      - permission: "estimate:approve"
        gated_by: "TenantSettings.pmCanApproveEstimates"

