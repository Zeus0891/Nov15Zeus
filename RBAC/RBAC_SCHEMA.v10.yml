# ========================================================================
# ROLES — PHASE 1 INTERNAL MEMBERS ONLY
#  ✅ RBAC CORE: definición de roles lógicos (no son roles de Postgres).
#  Se usan por:
#    • JWT (claim roles)
#    • app.is_admin(), app.is_project_manager(), etc.
# ========================================================================
roles:
  - code: "ADMIN"
    hierarchy: 0
    display_name: "Administrator"
    description: "Tenant owner created automatically during signup; full control of business data ONLY within their tenant."
    role_type: "INTERNAL"
    creation_context:
      created_when: "During tenant signup"
      tenant_linkage: "One ADMIN owns the tenant they created"
    exclusions:
      - "No system or global admin powers"
      - "No cross-tenant access"

  - code: "PROJECT_MANAGER"
    hierarchy: 2
    display_name: "Project Manager"
    description: "Scoped manager for own/assigned projects, tasks, estimates, and invoices."
    role_type: "INTERNAL"
    critical_permissions_note: "Elevated approvals/financials gated by TenantSettings (ABAC hook)."

  - code: "WORKER"
    hierarchy: 8
    display_name: "Worker"
    description: "Executes assigned tasks and tracks personal work."
    role_type: "INTERNAL"

  - code: "DRIVER"
    hierarchy: 9
    display_name: "Driver"
    description: "Access limited to delivery assignments and own data."
    role_type: "INTERNAL"

  - code: "VIEWER"
    hierarchy: 10
    display_name: "Viewer"
    description: "Read-only sandbox tenant role."
    role_type: "INTERNAL"

