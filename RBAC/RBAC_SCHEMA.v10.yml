# ========================================================================
#  🏛️ BeeSmart Pro ERP — RBAC / RLS SCHEMA V10 (Authoritative)
#  PHASE 1 INTERNAL MEMBERS — OFFICIAL TEMPLATE
#
#  This file defines the authoritative RBAC schema structure.
#  All permissions and grants remain EMPTY for population later.
#
#  LAYERS EXPLAINED:
#    • RBAC  = roles + permission_catalog + role_grants
#    • RLS   = enforced in Postgres policies using app.* helpers
#    • ABAC  = future: attribute-based (TenantSettings, flags, context)
#    • ReBAC = future: relationship-based (who relates to what)
#
#  DO NOT deviate from this structure. DO NOT add platform/system roles.
#  Fully aligned with:
#     • RLS helpers in schema "app"
#     • TenantSettings gating
#     • 5 internal roles
#     • domain:action:subaction naming
# ========================================================================

rbac_version: "10"
generated_date: "TBD"
compatibility: "BeeSmart Pro ERP"
phase: "PHASE_1_INTERNAL_MEMBERS"
source_document: "rbac_permissions_master.md"
description: "Authoritative RBAC + RLS schema structure for BeeSmart ERP with empty permissions (Phase 1 Internal Members)."
conventions_aligned: true

# ========================================================================
# SECURITY CONTEXT
#  ✅ DOCUMENTA cómo interactúan RBAC, RLS, ABAC, ReBAC.
#  No ejecuta nada por sí mismo; es contrato para el generador y las policies SQL.
#
#  • RBAC  → Qué puede hacer un rol (permission_catalog + role_grants)
#  • RLS   → Sobre qué filas/tablas se evalúa (tenantId, actor, etc.)
#  • ABAC  → (Futuro) Atributos dinámicos: TenantSettings, contexto, flags
#  • ReBAC → (Futuro) Relaciones entre entidades: quién se relaciona con qué
# ========================================================================
security_configuration:
  role_hierarchy_convention: "0_is_highest"
  hierarchy_range: "0-10"
  phase_1_roles: 5
  role_inheritance: "none"

  permission_strategy: "explicit_minimal_catalog"
  naming_convention: "domain:action:subaction"
  naming_examples:
    - "estimate:create"
    - "project:read:team"
    - "task:update:status"

  # 🚦 SECURITY LAYERS:
  #   • RBAC  = requirePermission('domain:action:subaction') desde backend
  #   • RLS   = policies en Postgres usando app.current_tenant_id(), app.is_*
  #   • ABAC  = (fase futura) TenantSettings + atributos de usuario/contexto
  #   • ReBAC = (fase futura) relaciones Member/Project/Account en AccessPolicy
  security_layers:
    - "RBAC (static role permissions: permission_catalog + role_grants)"
    - "TenantSettings (runtime flags for PM elevated permissions: ABAC hook)"
    - "RLS (strict multi-tenant isolation via app.current_tenant_id())"
    - "Future: AccessPolicies for ABAC/ReBAC (Phase 2+)"

  design_principles:
    - "ADMIN = tenant owner created during signup"
    - "Strict tenant isolation (no cross-tenant access)"
    - "No system/platform roles in Phase 1"
    - "No wildcard permissions"
    - "Explicit permissions only"
    - "Future-ready for AccessPolicy engine (Phase 2+)"

  compliance:
    - "SOC2_TYPE_II"
    - "GDPR"
    - "MULTI_TENANT_ISOLATED"

# ========================================================================
# DOMAINS — Must match real ERP modules EXACTLY
#  🔐 RBAC: cada domain es el prefijo de permissions (domain:action:subaction).
#  🔐 RLS: cada domain apunta a módulos .prisma con tenantId y policies.
# ========================================================================
domains:
  # GLOBAL / PLATFORM CONTEXT (configuración y control del tenant)
  - { key: "tenant",        module: "tenantConfig.prisma" }
  - { key: "accesscontrol", module: "accessControlTenant.prisma" }
  - { key: "identity",      module: "identityCore.prisma, identityAuthN.prisma, identityAuthZ.prisma" }
  - { key: "membership",    module: "membership.prisma" }

  # CORE BUSINESS (TENANT CONTEXT — RLS OBLIGATORIO)
  - { key: "estimate",      module: "estimate.prisma" }
  - { key: "invoice",       module: "invoice.prisma" }
  - {
      key: "project",
      module: "projectsCore.prisma, projectTaskScheduling.prisma, projectRisk.prisma, RFI.prisma, submittals.prisma, contracts.prisma, workOrders.prisma"
    }

  - { key: "task",          module: "tasks.prisma" }
  - { key: "expenses",      module: "expensecore.prisma" }

  - {
      key: "inventory",
      module: "inventoryCore.prisma, inventoryTransactions.prisma, inventoryControl.prisma"
    }

  - {
      key: "scheduling",
      module: "schedulingCore.prisma, schedulingEngine.prisma"
    }

  - { key: "time",          module: "timeattendance.prisma" }
  - { key: "payroll",       module: "payroll.prisma" }

  - {
      key: "crm",
      module: "crmcore.prisma, crmcommunication.prisma, crmrelationships.prisma, customerportal.prisma"
    }

  - {
      key: "documents",
      module: "documentscore.prisma, esignature.prisma, aidocument.prisma"
    }

  - { key: "changeorder",   module: "changeorder.prisma" }

  - {
      key: "ai",
      module: "aicore.prisma, aiinsights.prisma"
    }

  - {
      key: "analytics",
      module: "analytics.prisma, dashboards.prisma"
    }

  # FINANCE & ACCOUNTING DOMAINS
  - { key: "billing",       module: "billing.prisma" }
  - { key: "banking",       module: "banking.prisma" }
  - { key: "accounting",    module: "accountingtransaction.prisma, generalledger.prisma" }
  - { key: "payments",      module: "paymentsARCashApplication.prisma" }
  - { key: "corpcards",     module: "corpcards.prisma" }
  - { key: "tax",           module: "taxcompliance.prisma" }

  # QUALITY & RISK DOMAINS
  - { key: "quality",       module: "quality.prisma" }
  - { key: "safety",        module: "safety.prisma" }
  - { key: "compliance",    module: "compliance.prisma" }
  - { key: "approvals",     module: "approvals.prisma" }

  # PROCUREMENT & OPERATIONS
  - { key: "procurement",   module: "procurementPo.prisma" }
  - { key: "jobcosting",    module: "jobCosting.prisma" }
  - { key: "maintenance",   module: "maintenanceService.prisma" }

  # HUMAN RESOURCES
  - { key: "hr",            module: "hrcore.prisma" }

  # PLATFORM & INTEGRATIONS
  - { key: "platform",      module: "platformRegistry.prisma, publicLinkEngine.prisma" }
  - { key: "integrations",  module: "integrationsCore.prisma, integrationsSyncEngine.prisma" }
  - { key: "notifications", module: "notifications.prisma" }

  # COMMUNICATION / MESSAGING LAYER
  - { key: "messaging",     module: "messaging.prisma, emailengine.prisma, smscalls.prisma" }

  # CONSTRUCTION SPECIALIZED DOMAINS
  - { key: "roomtech",      module: "roomModel.prisma, roomScanner.prisma" }
  - { key: "weather",       module: "weatherIntelligenceCore.prisma, weatherImpactAlerts.prisma" }
  - { key: "zeroloss",      module: "zeroLoss.prisma" }

# ========================================================================
# ACTIONS — Standardized Vocabulary
#  ✅ RBAC: segunda parte del permiso (domain:ACTION:subaction)
# ========================================================================
actions:
  - "create"
  - "read"
  - "list"
  - "update"
  - "delete"
  - "approve"
  - "send"
  - "assign"
  - "upload"
  - "comment"
  - "writeoff"
  - "adjust"
  - "investigate"
  - "run"
  - "correct"
  - "ask"
  - "assist"
  - "generate"

# ========================================================================
# SUBACTIONS — Granular Access Slices
#  ✅ RBAC: tercera parte del permiso (domain:action:SUBACTION)
#  ✅ ABAC / ReBAC hooks futuros:
#     Ej: project:read:team + AccessPolicy = "solo proyectos donde soy PM"
# ========================================================================
