# ============================================================================
# ARCHITECTURAL MODEL
# ============================================================================

architecture:
  model: "BeeSmart's 2-Tier Security Model"
  classification: "GLOBAL/HYBRID/TENANT with Public Link Pattern"
  
  tiers:
    global:
      table_count: 17
      purpose: "System infrastructure"
      includes:
        - "User, Actor, Session"
        - "IdentityProvider, AuthFactor"
        - "Permission, AccessResource"
        - "Tenant (registry)"
        - "PublicLinkEngine"
    
    tenant:
      table_count: 607
      purpose: "ALL business data"
      includes:
        - "All business modules"
        - "Estimate, Invoice, Project"
        - "CRM, CustomerPortal"
        - "Everything else"
  
  external_access_patterns:
    public_links:
      type: "No-login token-based access"
      mechanism: "Token validation → Load resource → Bypass RBAC → Tenant-scoped actions"
    
    customer_portal:
      type: "Portal RBAC (separate from internal)"
      mechanism: "Portal login → Portal Auth → Tenant context → Filtered data"
  
  multi_tenant_isolation:
    rule: "ALL TENANT tables have tenantId NOT NULL + RLS policy + indexed on tenantId"
    enforcement: "Cannot cross tenant boundaries"

