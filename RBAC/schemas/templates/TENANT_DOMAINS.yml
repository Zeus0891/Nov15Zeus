# 🏢 TENANT DOMAINS
# Authoritative Classification for BeeSmart ERP
# 100% ALIGNED WITH: ERP_AUTHORITATIVE_MODULE_STRUCTURE_v2.0.md

metadata:
  date: "2025-11-19"
  version: "2.0"
  classification: "TENANT"
  description: "Has tenantId, RLS-Isolated"
  source_of_truth: "ERP_AUTHORITATIVE_MODULE_STRUCTURE_v2.0.md"
  alignment_status: "100% SYNCHRONIZED"

# ============================================================================
# DEFINITION: TENANT Tables
# ============================================================================

definition:
  description: "Tables that ALWAYS have tenantId field and RLS policies enforced"
  criteria:
    - "ALWAYS have tenantId field"
    - "ALWAYS have RLS policies enforced"
    - "Tenant-isolated (one tenant cannot see another's data)"
    - "All business operations"
  scope: "These represent ALL business modules in the ERP"

# ============================================================================
# SUMMARY (From ERP_AUTHORITATIVE_MODULE_STRUCTURE_v2.0.md)
# ============================================================================

summary:
  total_modules_with_tenant_tables: 60
  total_tenant_tables: 607
  
  breakdown:
    from_global_modules:
      module_count: 4
      table_count: 24
      modules:
        - "identity (4 tenant tables)"
        - "identitysecurity (1 tenant table)"
        - "accesscontrol (10 tenant tables)"
        - "tenant (9 tenant tables)"
    
    from_hybrid_modules:
      module_count: 17
      table_count: 189
      note: "ALL tables in HYBRID modules are tenant-scoped with PublicLink external access"
    
    from_tenant_modules:
      module_count: 40
      table_count: 417
      note: "Pure internal operations, no external access"

# ============================================================================
# TENANT TABLES FROM GLOBAL MODULES
# ============================================================================

global_modules_with_tenant_tables:
  description: "TENANT tables within GLOBAL infrastructure modules"
  
  modules:
    # ------------------------------------------------------------------------
    # 1. identity (GLOBAL module with TENANT tables)
    # ------------------------------------------------------------------------
    - module_name: "identity"
      module_file: "identity.prisma"
      scope: "GLOBAL"
      total_tables: 8
      global_tables: 4
      tenant_tables: 4
      description: "Core identity infrastructure - tenant-specific user data"
      
      tenant_table_list:
        - name: "UserProfile"
          purpose: "Tenant-specific user profile data. Different profile per tenant"
        - name: "UserSetting"
          purpose: "Tenant-specific user preferences and settings"
        - name: "UserInvitation"
          purpose: "Tenant-specific user invitation records"
        - name: "UserHistoryEvent"
          purpose: "Tenant-specific audit trail for user actions within tenant context"
    
    # ------------------------------------------------------------------------
    # 2. identitysecurity (GLOBAL module with TENANT tables)
    # ------------------------------------------------------------------------
    - module_name: "identitysecurity"
      module_file: "identitysecurity.prisma"
      scope: "GLOBAL"
      total_tables: 11
      global_tables: 10
      tenant_tables: 1
      description: "Security infrastructure - tenant-specific SSO configuration"
      
      tenant_table_list:
        - name: "TenantIdentityProvider"
          purpose: "Tenant-specific SSO configuration. Links tenant to global IdentityProvider with custom settings"
    
    # ------------------------------------------------------------------------
    # 3. accesscontrol (GLOBAL module with TENANT tables)
    # ------------------------------------------------------------------------
    - module_name: "accesscontrol"
      module_file: "accesscontrol.prisma"
      scope: "GLOBAL"
      total_tables: 12
      global_tables: 2
      tenant_tables: 10
      description: "Permission catalog - tenant-specific role mappings"
      
      tenant_table_list:
        - name: "Role"
          purpose: "Tenant-specific role instances (ADMIN, PROJECT_MANAGER, etc.). References global Permissions"
        - name: "RolePermission"
          purpose: "Maps global Permissions to tenant Roles. Many-to-many relationship"
        - name: "MemberRole"
          purpose: "Maps Members to Roles within tenant. User's effective permissions"
        - name: "AccessPolicy"
          purpose: "Advanced access policies for ABAC (Attribute-Based Access Control). Tenant-specific rules"
        - name: "AccessPolicyCondition"
          purpose: "Conditions for access policies (time-based, location-based, etc.)"
        - name: "AccessScope"
          purpose: "Defines access scopes (own, team, department, tenant)"
        - name: "AccessScopeAssignment"
          purpose: "Assigns scopes to roles or members"
        - name: "AccessAuditEvent"
          purpose: "Audit trail for access control changes within tenant"
        - name: "ServiceAccount"
          purpose: "Tenant-specific service accounts for API access and automation"
        - name: "ServiceAccountKey"
          purpose: "API keys for tenant service accounts"
    
    # ------------------------------------------------------------------------
    # 4. tenant (GLOBAL module with TENANT tables)
    # ------------------------------------------------------------------------
    - module_name: "tenant"
      module_file: "tenant.prisma"
      scope: "GLOBAL"
      total_tables: 10
      global_tables: 1
      tenant_tables: 9
      description: "Tenant registry - tenant-specific configuration"
      
      tenant_table_list:
        - name: "TenantSettings"
          purpose: "Tenant-specific configuration and preferences"
        - name: "TenantSubscription"
          purpose: "Subscription and billing information for tenant"
        - name: "TenantUsageRecord"
          purpose: "Usage tracking and metering for billing"
        - name: "TenantDomain"
          purpose: "Custom domain mappings for tenant (e.g., acme.beesmart.pro)"
        - name: "TenantBranding"
          purpose: "Tenant-specific branding (logo, colors, etc.)"
        - name: "TenantModule"
          purpose: "Module enablement flags per tenant (which modules are active)"
        - name: "TenantFeatureFlag"
          purpose: "Feature flag configuration per tenant"
        - name: "TenantComplianceSetting"
          purpose: "Compliance and regulatory settings per tenant"
        - name: "TenantHistoryEvent"
          purpose: "Audit trail for tenant-level configuration changes"

