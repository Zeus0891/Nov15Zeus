# ============================================================================
# CRITICAL PRINCIPLES (From ERP Document)
# ============================================================================

principles:
  - title: "ALL business data is tenant-scoped"
    description: "Every single business operation in the ERP is tenant-isolated"
    note: "TENANT tables have tenantId field and RLS policy"
  
  - title: "External interaction does NOT change classification"
    description: "Tables remain tenant-scoped even when external clients interact via public links"
    cases:
      - "External clients interact via public links"
      - "External parties are represented (CRM)"
      - "Payments come from external sources"
      - "Documents are shared with external parties"
      - "E-signatures involve external signers"
  
  - title: "Public links are access mechanism, not security domain"
    description: "PublicLink tables are TENANT tables that enable token-based external access"
    pattern: "Estimate (tenant table) → EstimatePublicLink (tenant table) → External client accesses via token"
  
  - title: "Customer Portal uses separate RBAC domain"
    internal_rbac: "ADMIN, PROJECT_MANAGER, WORKER, DRIVER, VIEWER (use Member context)"
    external_portal_rbac: "CLIENT, VENDOR, PARTNER (use CustomerPortalUser context)"
    note: "Different API layer, different permission model, still tenant-scoped tables"
  
  - title: "CRM represents external, but tables are tenant-scoped"
    explanation: "CRMAccount/CRMContact represent external parties but tables have tenantId"
    access: "External parties interact via PublicLinks or CustomerPortal, not direct CRM access"

# ============================================================================
# VALIDATION CHECKLIST
# ============================================================================

validation_checklist:
  criteria:
    - check: "Has tenantId field"
      status: "✅ All tables"
    - check: "Has RLS policy enforcing tenant isolation"
      status: "✅ All tables"
    - check: "Belongs to a business module"
      status: "✅ All 60 modules"
    - check: "Is NOT part of global identity/security infrastructure"
      status: "✅ Confirmed"
    - check: "Is NOT the Tenant registry itself"
      status: "✅ Tenant registry is GLOBAL"

