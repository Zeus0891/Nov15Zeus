# ============================================================================
# ROLE GRANTS - Optimized Business-Aligned Permissions
# ============================================================================
role_grants:
  # ======= ADMIN - Full System Access =======
  ADMIN:
    permissions:
      # System administration
      - "accesscontrol:*"
      - "identity:*"
      # Business operations (expanded by generator)
      - "crm:*"
      - "estimate:*"
      - "invoice:*"
      - "project:*"
      - "inventory:*"
      - "expenses:*"
      - "scheduling:*"
      - "payroll:*"
      - "documents:*"
      - "ai:*"
    note: "Wildcards expanded by generator, not used at runtime"

  # ======= EXECUTIVE - Strategic Overview =======
  EXECUTIVE:
    permissions:
      # Read-only strategic access
      - "project:read"
      - "invoice:read"
      - "estimate:read"
      - "expenses:read"
      - "payroll:read"
      - "documents:read"
      - "ai:read"
      - "ai:analyze"

  # ======= PROJECT_MANAGER - Project Operations =======
  PROJECT_MANAGER:
    permissions:
      # Project management
      - "project:read"
      - "project:create"
      - "project:update"
      - "project:assign"
      - "project:assign:employee"
      - "project:update:status"
      - "project:update:budget"
      - "project:close"
      - "project:reopen"
      # Estimate workflow
      - "estimate:read"
      - "estimate:create"
      - "estimate:update"
      - "estimate:approve"
      - "estimate:send"
      - "estimate:convert"
      - "estimate:export"
      # Invoice creation
      - "invoice:read"
      - "invoice:create"
      - "invoice:send"
      - "invoice:export"
      # Team and scheduling
      - "scheduling:read"
      - "scheduling:create"
      - "scheduling:update"
      - "scheduling:assign"
      # Documentation
      - "documents:read"
      - "documents:create"
      - "documents:update"
      # CRM access
      - "crm:read"
      - "crm:update"

  # ======= FINANCE_CONTROLLER - Financial Operations =======
  FINANCE_CONTROLLER:
    permissions:
      # Full financial access
      - "invoice:read"
      - "invoice:create"
      - "invoice:update"
      - "invoice:approve"
      - "invoice:send"
      - "invoice:export"
      # Payment processing
      - "invoice:pay"
      # Expense oversight
      - "expenses:read"
      - "expenses:approve"
      - "expenses:reject"
      # Payroll oversight
      - "payroll:read"
      - "payroll:approve"
      - "payroll:export"
      # Project financial data
      - "project:read"
      - "project:update:budget"
      # Estimates for financial review
      - "estimate:read"
      - "estimate:approve"

  # ======= HR_MANAGER - Human Resources =======
  HR_MANAGER:
    permissions:
      # Employee management
      - "identity:read"
      - "identity:create"
      - "identity:update"
      # Payroll management
      - "payroll:read"
      - "payroll:create"
      - "payroll:update"
      - "payroll:process"
      - "payroll:export"
      # Scheduling oversight
      - "scheduling:read"
      - "scheduling:update"
      # Document access
      - "documents:read"
      - "documents:create"
      - "documents:update"

  # ======= ESTIMATOR - Estimate Management =======
  ESTIMATOR:
    permissions:
      # Full estimate access
      - "estimate:read"
      - "estimate:create"
      - "estimate:update"
      - "estimate:send"
      - "estimate:export"
      - "estimate:update:status"
      # CRM for client data
      - "crm:read"
      # Inventory for pricing
      - "inventory:read"
      # Project reference
      - "project:read"
      # Documents
      - "documents:read"
      - "documents:create"

  # ======= ACCOUNTING - Transaction Processing =======
  ACCOUNTING:
    permissions:
      # Invoice operations
      - "invoice:read"
      - "invoice:create"
      - "invoice:update"
      - "invoice:export"
      # Payment processing
      - "invoice:pay"
      # Expense processing
      - "expenses:read"
      - "expenses:create"
      - "expenses:update"
      # Document access
      - "documents:read"
      - "documents:create"

  # ======= SCHEDULER - Resource Planning =======
  SCHEDULER:
    permissions:
      # Full scheduling access
      - "scheduling:read"
      - "scheduling:create"
      - "scheduling:update"
      - "scheduling:delete"
      - "scheduling:assign"
      # Project visibility
      - "project:read"
      - "project:read:assigned"
      # Employee information
      - "identity:read"
