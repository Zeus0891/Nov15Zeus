      - "payroll:create"
      - "payroll:update"
      - "payroll:process"
      - "payroll:export"
      # Employee data
      - "identity:read"
      # Scheduling for time data
      - "scheduling:read"
      # Documents
      - "documents:read"
      - "documents:create"

  # ======= WORKER - Field Operations =======
  WORKER:
    permissions:
      # Own records
      - "identity:read:own"
      - "identity:update:own"
      # Assigned work
      - "project:read:assigned"
      - "scheduling:read:own"
      - "scheduling:update:own"
      # Expenses
      - "expenses:read:own"
      - "expenses:create:own"
      - "expenses:update:own"
      # Documents
      - "documents:read:assigned"
      - "documents:create"

