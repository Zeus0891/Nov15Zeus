      - "project:read:assigned"
      - "estimate:read:own"
      - "estimate:approve"
      # Own invoices
      - "invoice:read:own"
      - "invoice:pay"
      # Documents
      - "documents:read:assigned"
      - "documents:read:public"

  # ======= CLIENT_MANAGER - Client Operations =======
  CLIENT_MANAGER:
    permissions:
      # Assigned projects
      - "project:read:assigned"
      - "estimate:read:own"
      # Own invoices
      - "invoice:read:own"
      # Documents
      - "documents:read:assigned"
      - "documents:read:public"

  # ======= CLIENT_VIEWER - Client Read-Only =======
  CLIENT_VIEWER:
    permissions:
