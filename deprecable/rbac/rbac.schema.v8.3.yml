    - "project:read:assigned"
    - "project:list:delivery_assigned"
    - "project:read:delivery_info"
    # Critical permissions (NOT granted by default to PROJECT_MANAGER)
    - "project:delete"
    - "project:read:financial"

  # ======= TASK DOMAIN =======
  task:
    - "task:create"
    - "task:list"
    - "task:read"
    - "task:update"
    - "task:delete"
    - "task:assign:worker"
