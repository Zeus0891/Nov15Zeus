  # Approval permissions
  approvals:
    - "estimate:approve"
    - "estimate:delete:own"
    - "invoice:approve"
    - "invoice:delete:own"

  # Financial insight permissions
  financial_insights:
    - "project:read:financial"
    - "estimate:read:profit"
    - "invoice:read:profit"
    - "analytics:read:tenant_kpis"

  # Administrative permissions
  administrative:
    - "project:delete"
    - "expenses:approve"

  tenant_settings_flags:
    - "pmCanApproveEstimates"
    - "pmCanApproveInvoices"
    - "pmCanSeeProfit"
    - "pmCanDeleteProjects"
    - "pmCanApproveExpenses"

