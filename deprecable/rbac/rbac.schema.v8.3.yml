# 🏛️ RBAC Schema v8.3 - Phase 1 Clean Implementation
# BeeSmart Pro Construction ERP - Simplified Internal Roles
#
# PHASE 1 CLEAN DESIGN:
# ✅ 5 internal roles only (ADMIN, PROJECT_MANAGER, WORKER, DRIVER, VIEWER)
# ✅ Baseline permissions vs critical/elevated permissions clearly separated
# ✅ Aligned with rbac.permissions.md specification
# ✅ Standardized naming: domain:action:subaction format
# ✅ Clean YAML structure, production ready
# ✅ External roles preserved for future phases

# ============================================================================
# RBAC METADATA & VERSIONING
# ============================================================================
rbac_version: "8.3-phase1"
generated_date: "2025-11-18T22:30:00Z"
compatibility: "BeeSmart Pro ERP Platform"
conventions_aligned: true
description: "Phase 1 clean RBAC schema - 5 internal roles with baseline permissions"

# ============================================================================
# PHASE 1 SECURITY CONFIGURATION
# ============================================================================
security_configuration:
  # Role hierarchy (0 = highest privilege)
  role_hierarchy_convention: "0_is_highest"
  hierarchy_range: "0-10"

  # Phase 1 permission strategy
  permission_strategy: "baseline_plus_critical_separation"
  total_permissions: 145
  naming_convention: "domain:action:subaction"

  # Three-layer security architecture
  security_layers:
    - "RBAC (static baseline permissions)"
    - "TenantSettings (critical permission toggles)"
    - "RLS (row-level data isolation)"

  # Phase 1 scope and focus
  phase1_focus:
    internal_roles: 5
    baseline_permissions: "Always granted to roles"
    critical_permissions: "Defined but NOT granted by default"
    external_roles: "Preserved but not actively used"
    future_enterprise_roles: "Removed from active schema"

  # Compliance alignment
  compliance_standards:
    - "SOC2_TYPE_II"
    - "GDPR_COMPLIANT"
    - "ISO27001_ALIGNED"
    - "CONSTRUCTION_INDUSTRY_OPTIMIZED"

# ============================================================================
# STANDARDIZED DOMAINS - Core ERP Modules
# ============================================================================
domains:
  - key: "tenant"
    description: "Tenant management and configuration"

  - key: "identity"
    description: "User and actor identity management"

  - key: "membership"
    description: "Member management and role assignment"

  - key: "accesscontrol"
    description: "Role and permission management"

  - key: "estimate"
    description: "Estimate and proposal management"

  - key: "invoice"
    description: "Invoice and billing management"

  - key: "project"
    description: "Project management and execution"

  - key: "task"
    description: "Task management and assignment"

  - key: "expenses"
    description: "Expense tracking and reimbursement"

  - key: "time"
    description: "Time tracking and timesheets"

  - key: "scheduling"
    description: "Resource and time scheduling"

  - key: "payroll"
    description: "Payroll processing and management"

  - key: "inventory"
    description: "Materials and stock management"

  - key: "crm"
    description: "Customer relationship management"

  - key: "documents"
    description: "Document and file management"

  - key: "ai"
    description: "AI assistance and automation"

  - key: "analytics"
    description: "Business intelligence and KPIs"

# ============================================================================
# PHASE 1 ROLES - 5 Internal (Active) + 5 External (Preserved)
# ============================================================================
roles:
  # ======= PHASE 1 INTERNAL ROLES - ACTIVE =======

  - code: "ADMIN"
    hierarchy: 0
    display_name: "Administrator"
    description: "Tenant owner with full CRUD on all tenant data, no platform/system power"
    role_type: "INTERNAL"
    phase1_status: "ACTIVE"
    business_context:
      typical_users:
        ["Tenant Owners", "Company Owners", "Business Administrators"]
      access_scope: "All tenant business data and configuration"
      use_cases:
        ["Tenant management", "User administration", "Full business operations"]
      financial_scope: "Complete tenant financial visibility and control"

  - code: "PROJECT_MANAGER"
    hierarchy: 2
    display_name: "Project Manager"
    description: "Broad but scoped access to own/assigned projects, critical actions gated by TenantSettings"
    role_type: "INTERNAL"
    phase1_status: "ACTIVE"
    business_context:
      typical_users:
        ["Project Managers", "Construction Managers", "Site Supervisors"]
      access_scope: "Own/assigned projects, estimates, invoices, tasks"
      use_cases:
        ["Project execution", "Team coordination", "Client communication"]
      financial_scope: "Project-level financial visibility, no tenant-wide profit/KPIs"
      critical_note: "Approval and financial insight permissions gated by TenantSettings"

  - code: "WORKER"
    hierarchy: 8
    display_name: "Worker"
    description: "Execution role for tasks, own time/expenses, assigned project visibility only"
    role_type: "INTERNAL"
    phase1_status: "ACTIVE"
    business_context:
      typical_users:
        ["Field Workers", "Technicians", "Office Staff", "Contractors"]
      access_scope: "Assigned tasks, own time/expenses, assigned project operational details"
      use_cases:
        [
          "Task execution",
          "Time tracking",
          "Progress reporting",
          "Expense submission",
        ]
      financial_scope: "No financial data access"

  - code: "DRIVER"
    hierarchy: 9
    display_name: "Driver"
    description: "Delivery/logistics role with minimal project info and delivery task focus"
    role_type: "INTERNAL"
    phase1_status: "ACTIVE"
    business_context:
      typical_users:
        [
          "Delivery Drivers",
          "Logistics Staff",
          "Couriers",
          "Delivery Personnel",
        ]
      access_scope: "Delivery tasks, delivery project info, own time/expenses, delivery docs"
      use_cases:
        ["Delivery execution", "Basic time logging", "Delivery documentation"]
      financial_scope: "No financial data access"

  - code: "VIEWER"
    hierarchy: 10
    display_name: "Viewer"
    description: "Read-only sandbox-only role for demo/training, NEVER for production tenants"
    role_type: "INTERNAL"
    phase1_status: "ACTIVE"
    business_context:
      typical_users: ["Demo Users", "Trainees", "Prospects", "Evaluators"]
      access_scope: "Read-only access in sandbox tenants ONLY"
      use_cases: ["Product demonstration", "Training", "System evaluation"]
      financial_scope: "Demo financial data only (sandbox environment)"
      enforcement_critical: "MUST be enforced via RLS - no production tenant access allowed"

  # ======= EXTERNAL ROLES - PRESERVED FOR FUTURE PHASES =======

  - code: "CLIENT_OWNER"
    hierarchy: 6
    display_name: "Client Owner"
    description: "Client company owner with project oversight"
    role_type: "EXTERNAL"
    phase1_status: "PRESERVED"

  - code: "CLIENT_MANAGER"
    hierarchy: 7
    display_name: "Client Manager"
    description: "Client project management and coordination"
    role_type: "EXTERNAL"
    phase1_status: "PRESERVED"

  - code: "CLIENT_VIEWER"
    hierarchy: 8
    display_name: "Client Viewer"
    description: "Client stakeholder with limited access"
    role_type: "EXTERNAL"
    phase1_status: "PRESERVED"

  - code: "VENDOR"
    hierarchy: 7
    display_name: "Vendor/Supplier"
    description: "External vendor or supplier access"
    role_type: "EXTERNAL"
    phase1_status: "PRESERVED"

  - code: "GUEST"
    hierarchy: 10
    display_name: "Guest User"
    description: "Temporary or demo access"
    role_type: "EXTERNAL"
    phase1_status: "PRESERVED"

